spring.application.name=db

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/d00e23b8-6f53-4f67-8a7b-b1f47ab3a272/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/d00e23b8-6f53-4f67-8a7b-b1f47ab3a272/discovery/v2.0/keys

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://mysql:3306/sistema_ventas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true

# Esperar hasta 90 segundos a que la DB responda al arrancar
spring.datasource.hikari.connection-timeout=90000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
# Intentar reconectar si la DB se cae al inicio
spring.datasource.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=update